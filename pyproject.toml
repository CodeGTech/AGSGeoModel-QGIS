[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agsgeomodel"
dynamic = ["version"]
description = "Defensible geological interpretation and 3D ground models from AGS4 ground investigation data (headless core of the AGSGeoModel QGIS plugin)"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AGSGeoModel contributors" }]
keywords = ["geology", "geotechnical", "AGS4", "borehole", "BGS", "ground model", "QGIS", "HDD", "CPT", "kriging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
geo = ["scipy>=1.11", "pyproj>=3.6", "shapely>=2.0"]
io = ["openpyxl>=3.1", "laspy>=2.5", "ezdxf>=1.1"]
ml = ["scikit-learn>=1.4", "lightgbm>=4.0", "xgboost>=2.0"]
nlp = ["sentence-transformers>=2.6"]
viz = ["pyvista>=0.43", "trimesh>=4.0", "pygltflib>=1.16"]
bim = ["ifcopenshell>=0.8"]
ags = ["python-ags4>=1.0"]
gempy = ["gempy>=2024.2"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5", "pytest-cov>=5"]
docs = ["sphinx>=7", "myst-parser>=3", "sphinx-rtd-theme>=2"]
all = ["agsgeomodel[geo,io,ml,viz]"]

[project.urls]
Homepage = "https://github.com/YOUR-ORG/AGSGeoModel-QGIS"
Documentation = "https://github.com/YOUR-ORG/AGSGeoModel-QGIS/tree/main/docs"
Issues = "https://github.com/YOUR-ORG/AGSGeoModel-QGIS/issues"

[project.scripts]
agsgeomodel = "agsgeomodel.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "agsgeomodel.__version__" }

[tool.setuptools.packages.find]
include = ["agsgeomodel*"]

[tool.setuptools.package-data]
agsgeomodel = ["metadata.txt", "icons/*.svg", "gui/ui/*.ui", "help/*", "help/images/*", "geology/knowledge/data/*.json",
               "geology/knowledge/data/provinces/*.json", "importers/ags/data/*.json"]

# ------------------------------------------------------------------------------------------ tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not performance'"
markers = [
  "slow: runs the full pipeline (seconds to a minute)",
  "performance: large synthetic data sets (run with -m performance)",
  "qgis: needs the QGIS Python bindings",
  "network: contacts live services (never run in CI)",
]
filterwarnings = ["ignore::DeprecationWarning:sip.*", "ignore::DeprecationWarning:osgeo.*"]

[tool.coverage.run]
source = ["agsgeomodel"]
omit = ["agsgeomodel/gui/*", "agsgeomodel/plugin.py", "agsgeomodel/algorithms/*"]

# ------------------------------------------------------------------------------------------ lint
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PIE", "RUF100"]
ignore = [
  "E741",   # geology code uses l (location) in short comprehensions
  "B905",   # zip(strict=) not required (3.12 target, many paired arrays)
  "N803", "N806",  # upper-case names for matrices (K, X, Y, P) follow the maths
  "SIM108", "SIM102", "SIM105", "SIM115",
  "B008",
  "N818",   # public exception names (DependencyMissing, Cancelled) predate the rule
  "UP047",  # TypeVar generics kept for readability
]

[tool.ruff.lint.per-file-ignores]
"agsgeomodel/gui/*" = ["N802", "N815"]  # Qt overrides and Qt-style signal names (zoomTo, ...)
"agsgeomodel/algorithms/*" = ["N802"]   # QgsProcessingAlgorithm overrides
"agsgeomodel/plugin.py" = ["N802"]
"tests/*" = ["E402", "N802"]
"agsgeomodel/processors/*" = ["N815"]
"agsgeomodel/reports/html.py" = ["E501"]   # minified stylesheet string   # unit-suffixed field names (cu_kPa, E_MPa) are deliberate

[tool.ruff.lint.isort]
known-first-party = ["agsgeomodel"]
known-third-party = ["qgis", "processing"]
