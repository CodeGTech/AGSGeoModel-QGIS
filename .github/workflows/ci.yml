name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check agsgeomodel tests scripts docs/conf.py
      - run: ruff format --check agsgeomodel tests scripts docs/conf.py

  core-tests:
    name: core (${{ matrix.python }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        deps: ["minimal", "extras"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (NumPy only)
        if: matrix.deps == 'minimal'
        run: pip install -e ".[dev]"
      - name: Install (optional dependencies)
        if: matrix.deps == 'extras'
        run: pip install -e ".[dev,geo,io,ml,viz]" pypdf
      - name: Tests
        run: pytest -m "not performance and not qgis" --cov=agsgeomodel --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12' && matrix.deps == 'extras'
        with:
          name: coverage
          path: coverage.xml

  qgis-tests:
    name: QGIS ${{ matrix.qgis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis: ["3.40"]
    defaults:
      run:
        shell: bash -el {0}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: qgis
          create-args: >-
            python=3.12 qgis=${{ matrix.qgis }} pytest hypothesis
          init-shell: bash
          cache-environment: true
      - name: QGIS and full test suite
        run: |
          export PYTHONPATH="$CONDA_PREFIX/share/qgis/python:$CONDA_PREFIX/share/qgis/python/plugins:$PYTHONPATH"
          export QGIS_PREFIX_PATH="$CONDA_PREFIX"
          export PROJ_DATA="$CONDA_PREFIX/share/proj" GDAL_DATA="$CONDA_PREFIX/share/gdal"
          python -c "from qgis.core import Qgis; print(Qgis.version())"
          pytest -m "not performance" -ra

  performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,geo]"
      - run: pytest -m performance -ra

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - name: Sphinx (warnings are errors)
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

  package:
    runs-on: ubuntu-latest
    needs: [lint, core-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown  # renders the offline help
      - run: python scripts/package_plugin.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/*.zip
