name: PyQGIS 4 compatibility check
 
on:
push:
workflow_dispatch:
 
jobs:
pyqgis4-check:
name: Check agsgeomodel for QGIS 4 compatibility
runs-on: ubuntu-latest
 
permissions:
contents: read
packages: read
 
container:
image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu
 
steps:
- name: Download repository files
uses: actions/checkout@v6
 
- name: Confirm the correct plugin folder
shell: bash
run: |
echo "Current repository location:"
pwd
 
echo "Checking for the agsgeomodel folder..."
 
if [ ! -d "./agsgeomodel" ]; then
echo "ERROR: The folder ./agsgeomodel was not found."
exit 1
fi
 
if [ ! -f "./agsgeomodel/metadata.txt" ]; then
echo "ERROR: The folder exists, but metadata.txt was not found."
exit 1
fi
 
echo "SUCCESS: The correct plugin folder was found."
echo "Plugin metadata:"
echo "./agsgeomodel/metadata.txt"
 
echo "Python files that will be checked:"
find ./agsgeomodel -type f -name "*.py" | sort
 
- name: Run checker on agsgeomodel
shell: bash
run: |
echo "The checker is scanning:"
echo "./agsgeomodel"
 
pyqt5_to_pyqt6.py \
--dry_run \
--logfile pyqgis4-checker.log \
./agsgeomodel
 
- name: Show checker report
if: always()
shell: bash
run: |
echo "PyQGIS 4 checker report"
echo "========================"
 
if [ -s pyqgis4-checker.log ]; then
cat pyqgis4-checker.log
elif [ -f pyqgis4-checker.log ]; then
echo "The report was created but is empty."
echo "This may mean no compatibility issues were found."
else
echo "No report was created."
echo "Open the previous workflow steps to see the error."
fi
 
- name: Make report downloadable
if: always()
uses: actions/upload-artifact@v7
with:
name: pyqgis4-checker-report
path: pyqgis4-checker.log
if-no-files-found: warn
retention-days: 14