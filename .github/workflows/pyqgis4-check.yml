name: PyQGIS 4 compatibility check

on:
  push:
  workflow_dispatch:

jobs:
  pyqgis4-check:
    name: Check agsgeomodel
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu

    steps:
      - name: Download repository files
        uses: actions/checkout@v6

      - name: Confirm plugin folder
        shell: bash
        run: |
          echo "Checking ./agsgeomodel"

          if [ ! -d "./agsgeomodel" ]; then
            echo "ERROR: agsgeomodel folder was not found"
            exit 1
          fi

          if [ ! -f "./agsgeomodel/metadata.txt" ]; then
            echo "ERROR: metadata.txt was not found"
            exit 1
          fi

          echo "Plugin folder found"
          find ./agsgeomodel -type f -name "*.py" | sort

      - name: Run PyQGIS 4 checker
        shell: bash
        run: |
          pyqt5_to_pyqt6.py --dry_run --logfile pyqgis4-checker.log ./agsgeomodel

      - name: Show checker report
        if: always()
        shell: bash
        run: |
          if [ -f pyqgis4-checker.log ]; then
            cat pyqgis4-checker.log
          else
            echo "No checker report was created"
          fi

      - name: Upload checker report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pyqgis4-checker-report
          path: pyqgis4-checker.log
          if-no-files-found: warn
          retention-days: 14